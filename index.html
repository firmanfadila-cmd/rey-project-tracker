<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="REY Project Tracker — PT Vertika Technologies Nusantara business development portfolio dashboard.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#090f18">
  <title>REY — Project Tracker</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231a6eb5'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='monospace' font-weight='700' font-size='12' fill='white'%3EREY%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy:         #090f18;
      --navy-surface: #0d1b2a;
      --surface:      rgba(255,255,255,0.038);
      --surface-h:    rgba(77,163,255,0.065);
      --border:       rgba(255,255,255,0.07);
      --border-h:     rgba(77,163,255,0.3);
      --text-1:       #dde8f5;
      --text-2:       #8fafc9;
      --text-muted:   #3f607e;
      --accent:       #4da3ff;
      --accent-mid:   #1a6eb5;
      --hot:    #ff6b6b;
      --active: #4da3ff;
      --poc:    #ffd166;
      --v2:     #b594f8;
      --done:   #2dd4a7;
    }

    html, body { min-height: 100vh; font-family: 'Outfit', sans-serif; background-color: var(--navy); color: var(--text-1); }

    body {
      background-image:
        radial-gradient(ellipse 90% 40% at 50% -10%, rgba(26,110,181,0.18) 0%, transparent 70%),
        url("data:image/svg+xml,%3Csvg width='40' height='40' viewBox='0 0 40 40' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='20' cy='20' r='0.8' fill='%234da3ff' fill-opacity='0.018'/%3E%3C/svg%3E");
    }

    /* ── SHARED HEADER ──────────────────────────── */
    .header {
      display: flex; align-items: center; justify-content: space-between; gap: 20px;
      padding: 22px 40px 18px; border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 50; background: var(--navy);
      background-image: radial-gradient(ellipse 90% 40% at 50% -10%, rgba(26,110,181,0.18) 0%, transparent 70%);
    }
    .brand { display: flex; align-items: center; gap: 14px; }
    .logo {
      width: 38px; height: 38px; border-radius: 10px; flex-shrink: 0;
      background: linear-gradient(145deg, var(--accent-mid) 0%, var(--accent) 100%);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Space Mono', monospace; font-weight: 700; font-size: 11px;
      color: #fff; letter-spacing: -0.5px; box-shadow: 0 4px 20px rgba(77,163,255,0.25);
    }
    .brand-title { font-size: 18px; font-weight: 800; letter-spacing: -0.5px; color: var(--text-1); }
    .brand-sub   { font-size: 11px; color: var(--text-2); margin-top: 2px; }
    .header-right { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
    .header-date  { font-family: 'Space Mono', monospace; font-size: 11px; color: var(--text-2); }
    .header-sync  { font-size: 10px; color: var(--text-muted); }

    .btn-new-project {
      padding: 6px 13px; border-radius: 8px; border: 1px solid rgba(77,163,255,0.4);
      background: rgba(77,163,255,0.08); color: var(--accent);
      font-family: 'Outfit', sans-serif; font-size: 12px; font-weight: 600;
      cursor: pointer; transition: all 0.18s; white-space: nowrap;
    }
    .btn-new-project:hover { background: rgba(77,163,255,0.15); border-color: var(--accent); }

    /* ── STATS BAR ───────────────────────────────── */
    .stats-bar {
      display: flex; gap: 10px; padding: 16px 40px;
      border-bottom: 1px solid var(--border); overflow-x: auto; scrollbar-width: none;
    }
    .stats-bar::-webkit-scrollbar { display: none; }
    .stat-pill {
      display: flex; align-items: center; gap: 9px; padding: 8px 14px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 100px; white-space: nowrap; flex-shrink: 0; transition: border-color 0.2s;
    }
    .stat-pill:hover { border-color: rgba(77,163,255,0.25); }
    .stat-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
    .stat-num { font-family: 'Space Mono', monospace; font-size: 14px; font-weight: 700; color: var(--text-1); }
    .stat-lbl { font-size: 12px; color: var(--text-2); font-weight: 500; }

    /* ── FILTERS ─────────────────────────────────── */
    .filters {
      display: flex; gap: 7px; padding: 12px 40px;
      border-bottom: 1px solid var(--border); overflow-x: auto; scrollbar-width: none;
    }
    .filters::-webkit-scrollbar { display: none; }
    .filter-btn {
      padding: 5px 12px; border-radius: 7px; border: 1px solid var(--border);
      background: transparent; color: var(--text-2); font-family: 'Outfit', sans-serif;
      font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.18s; white-space: nowrap;
    }
    .filter-btn:hover { border-color: var(--accent); color: var(--accent); background: rgba(77,163,255,0.05); }
    .filter-btn.active { background: var(--accent); border-color: var(--accent); color: #090f18; font-weight: 700; }

    /* ── CARD GRID ───────────────────────────────── */
    .grid-wrap { padding: 24px 40px 44px; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    @media (max-width: 1100px) { .grid { grid-template-columns: repeat(2,1fr); } }
    @media (max-width: 700px)  {
      .grid { grid-template-columns: 1fr; }
      .header,.stats-bar,.filters,.grid-wrap { padding-left: 18px; padding-right: 18px; }
    }

    /* ── CARD ───────────────────────────────────── */
    .card {
      position: relative; background: var(--surface); border: 1px solid var(--border);
      border-radius: 13px; padding: 18px 18px 16px; overflow: hidden; cursor: pointer;
      transition: transform 0.22s ease, border-color 0.22s ease, background 0.22s ease, box-shadow 0.22s ease;
      animation: cardIn 0.48s ease forwards; opacity: 0;
    }
    .card::before { content: ''; position: absolute; inset: 0 auto 0 0; width: 3px; border-radius: 13px 0 0 13px; }
    .card:hover { background: var(--surface-h); border-color: var(--border-h); transform: translateY(-3px); box-shadow: 0 12px 40px rgba(0,0,0,0.35); }
    .card[data-status="hot"]::before    { background: var(--hot); }
    .card[data-status="active"]::before { background: var(--active); }
    .card[data-status="poc"]::before    { background: var(--poc); }
    .card[data-status="v2"]::before     { background: var(--v2); }
    .card[data-status="done"]::before   { background: var(--done); }
    .card[data-status="hot"]  { box-shadow: 0 0 0 1px rgba(255,107,107,0.12) inset; }
    .card[data-status="hot"]:hover { border-color: rgba(255,107,107,0.35); box-shadow: 0 12px 40px rgba(255,107,107,0.12), 0 0 0 1px rgba(255,107,107,0.2) inset; }
    .card[data-status="done"] { opacity: 0.65; }
    .card[data-status="done"]:hover { opacity: 1; }
    .card.hidden { display: none; }
    @keyframes cardIn { from { opacity:0; transform:translateY(18px); } to { opacity:1; transform:translateY(0); } }

    .card-del {
      position: absolute; top: 10px; right: 10px;
      width: 22px; height: 22px; border-radius: 6px;
      border: 1px solid rgba(255,107,107,0.25); background: rgba(9,15,24,0.7);
      color: rgba(255,107,107,0.5); font-size: 11px; line-height: 1;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; opacity: 0; transition: opacity 0.18s, color 0.18s, border-color 0.18s, background 0.18s;
      z-index: 2;
    }
    .card:hover .card-del         { opacity: 1; }
    .card-del:hover                { color: var(--hot); border-color: rgba(255,107,107,0.6); background: rgba(255,107,107,0.12) !important; }

    .card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
    .card-identity { display: flex; align-items: center; gap: 10px; }
    .monogram {
      width: 36px; height: 36px; border-radius: 9px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Space Mono', monospace; font-size: 10px; font-weight: 700; color: #fff; letter-spacing: -0.3px;
    }
    .client-name { font-size: 13px; font-weight: 700; color: var(--text-1); letter-spacing: -0.3px; line-height: 1.2; }
    .client-sub  { font-size: 10px; color: var(--text-muted); margin-top: 2px; text-transform: uppercase; letter-spacing: 0.4px; }

    .status-badge {
      display: flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 100px;
      font-size: 10px; font-weight: 700; font-family: 'Space Mono', monospace;
      letter-spacing: 0.3px; border: 1px solid; flex-shrink: 0; white-space: nowrap;
    }
    .status-dot { width: 5px; height: 5px; border-radius: 50%; }
    .badge-hot    { color: var(--hot);    border-color: rgba(255,107,107,0.3); background: rgba(255,107,107,0.08); }
    .badge-active { color: var(--active); border-color: rgba(77,163,255,0.3);  background: rgba(77,163,255,0.07); }
    .badge-poc    { color: var(--poc);    border-color: rgba(255,209,102,0.3); background: rgba(255,209,102,0.07); }
    .badge-v2     { color: var(--v2);     border-color: rgba(181,148,248,0.3); background: rgba(181,148,248,0.07); }
    .badge-done   { color: var(--done);   border-color: rgba(45,212,167,0.3);  background: rgba(45,212,167,0.07); }
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.35; } }
    .badge-hot .status-dot { animation: pulse 2s ease-in-out infinite; }

    .card-project { font-size: 12px; color: var(--text-2); margin-bottom: 8px; line-height: 1.4; }
    .card-tags { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 11px; }
    .tag { padding: 2px 8px; border-radius: 5px; font-size: 10px; font-weight: 500; background: rgba(255,255,255,0.04); border: 1px solid var(--border); color: var(--text-2); }
    .tag-claims   { background: rgba(77,163,255,0.08);  border-color: rgba(77,163,255,0.2);  color: var(--accent); }
    .tag-uw       { background: rgba(181,148,248,0.08); border-color: rgba(181,148,248,0.2); color: var(--v2); }
    .tag-platform { background: rgba(45,212,167,0.08);  border-color: rgba(45,212,167,0.2);  color: var(--done); }

    .divider { height: 1px; background: var(--border); margin: 10px 0; }
    .card-row { display: grid; grid-template-columns: 38px 1fr; gap: 8px; margin-bottom: 6px; }
    .card-row:last-of-type { margin-bottom: 0; }
    .row-lbl  { font-size: 9px; font-family: 'Space Mono', monospace; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; padding-top: 2px; }
    .row-val  { font-size: 11.5px; color: var(--text-2); line-height: 1.45; }
    .row-val.urgent  { color: var(--hot); font-weight: 600; }
    .row-val.primary { color: var(--text-1); }
    .row-val.revenue { color: var(--done); font-weight: 600; }

    .progress-wrap    { margin-top: 12px; }
    .progress-header  { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
    .progress-lbl     { font-size: 9px; font-family: 'Space Mono', monospace; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .progress-count   { font-size: 10px; font-family: 'Space Mono', monospace; color: var(--text-2); }
    .progress-track   { height: 3px; background: rgba(255,255,255,0.06); border-radius: 100px; overflow: hidden; }
    .progress-fill    { height: 100%; border-radius: 100px; transition: width 1s cubic-bezier(0.4,0,0.2,1); }

    .no-results { grid-column:1/-1; text-align:center; padding:60px 20px; color:var(--text-muted); font-size:13px; display:none; }
    .no-results.visible { display:block; }

    /* ── FOOTER ──────────────────────────────────── */
    .footer {
      padding: 14px 40px; border-top: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center;
    }
    .footer-text  { font-family: 'Space Mono', monospace; font-size: 10px; color: var(--text-muted); }
    .footer-right { font-size: 10px; color: var(--text-muted); }

    /* ════════════════════════════════════════════
       DETAIL VIEW
    ═══════════════════════════════════════════ */
    #view-detail { min-height: calc(100vh - 72px); display: none; }

    .detail-header {
      display: flex; align-items: center; gap: 16px;
      padding: 18px 40px; border-bottom: 1px solid var(--border);
      background: rgba(11,21,32,0.9); backdrop-filter: blur(8px);
      position: sticky; top: 72px; z-index: 10;
    }
    .btn-back {
      padding: 6px 13px; border-radius: 8px; border: 1px solid var(--border);
      background: transparent; color: var(--text-2);
      font-family: 'Outfit', sans-serif; font-size: 13px; font-weight: 500;
      cursor: pointer; transition: all 0.18s; white-space: nowrap; flex-shrink: 0;
    }
    .btn-back:hover { border-color: var(--border-h); color: var(--text-1); }
    .detail-identity { flex: 1; min-width: 0; }
    .detail-client   { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.6px; font-family: 'Space Mono', monospace; margin-bottom: 3px; }
    .detail-title    { font-size: 18px; font-weight: 800; color: var(--text-1); letter-spacing: -0.5px; line-height: 1.2; }
    .detail-meta     { font-size: 11px; color: var(--text-2); margin-top: 4px; display: flex; gap: 16px; flex-wrap: wrap; }
    .detail-meta span { display: flex; align-items: center; gap: 4px; }
    .meta-lbl { color: var(--text-muted); font-family: 'Space Mono', monospace; font-size: 9px; text-transform: uppercase; letter-spacing: 0.4px; }

    .detail-body { padding: 28px 40px 60px; }

    .det-section { margin-bottom: 32px; }
    .det-section-hdr {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 14px;
    }
    .det-section-title {
      font-size: 10px; font-family: 'Space Mono', monospace; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: 0.6px;
    }

    /* ── TIMELINE CHIPS ──────────────────────────── */
    .timeline-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; max-width: 600px; }
    .timeline-chip { padding: 14px 16px; border-radius: 10px; background: var(--surface); border: 1px solid var(--border); }
    .tc-lbl   { font-size: 9px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; font-family: 'Space Mono', monospace; margin-bottom: 7px; }
    .tc-dates { font-size: 14px; color: var(--text-1); font-weight: 700; margin-bottom: 4px; letter-spacing: -0.3px; }
    .tc-days  { font-size: 11px; color: var(--text-2); }
    .var-badge { display:inline-block; padding:1px 7px; border-radius:4px; font-size:9px; font-weight:700; font-family:'Space Mono',monospace; margin-left:6px; vertical-align:middle; }
    .var-over  { background:rgba(255,107,107,0.15); color:var(--hot); }
    .var-under { background:rgba(45,212,167,0.15);  color:var(--done); }
    .var-on    { background:rgba(77,163,255,0.12);  color:var(--accent); }

    /* timeline edit form */
    .tl-edit-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; max-width:560px; margin-bottom:12px; }
    .tl-field label { display:block; font-size:9px; font-family:'Space Mono',monospace; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:5px; }

    /* ── TASK TABLE ──────────────────────────────── */
    .task-table-scroll { overflow-x: auto; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.06) transparent; }
    .task-table-scroll::-webkit-scrollbar { height: 3px; }
    .task-table-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 3px; }

    .task-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .task-table thead th {
      padding: 6px 10px; text-align: left; font-size: 9px;
      font-family: 'Space Mono', monospace; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: 0.5px; white-space: nowrap;
      border-bottom: 1px solid var(--border);
    }
    .task-table tbody td { padding: 9px 10px; color: var(--text-2); vertical-align: middle; border-bottom: 1px solid rgba(255,255,255,0.03); white-space: nowrap; }
    .task-table tbody tr:last-child td { border-bottom: none; }
    .task-table tbody tr:hover td { background: rgba(255,255,255,0.015); }

    .task-name-cell { color: var(--text-1); font-weight: 500; max-width: 200px; overflow: hidden; text-overflow: ellipsis; display: block; }

    .t-prog-wrap  { display:flex; align-items:center; gap:6px; min-width:80px; }
    .t-prog-track { height:3px; flex:1; background:rgba(255,255,255,0.06); border-radius:100px; overflow:hidden; }
    .t-prog-fill  { height:100%; border-radius:100px; }
    .t-prog-pct   { font-size:10px; color:var(--text-2); font-family:'Space Mono',monospace; width:30px; text-align:right; flex-shrink:0; }

    .ts-badge { display:inline-block; padding:2px 8px; border-radius:4px; font-size:9px; font-weight:700; font-family:'Space Mono',monospace; letter-spacing:0.3px; white-space:nowrap; }

    .t-remarks { max-width:140px; overflow:hidden; text-overflow:ellipsis; font-size:11.5px; }

    .t-actions { display:flex; gap:4px; }
    .t-btn {
      width:24px; height:24px; border-radius:6px; border:1px solid var(--border);
      background:transparent; color:var(--text-muted); cursor:pointer;
      display:flex; align-items:center; justify-content:center; font-size:13px;
      transition:all 0.15s; line-height:1;
    }
    .t-btn:hover      { border-color:var(--accent); color:var(--accent); background:rgba(77,163,255,0.08); }
    .t-btn.del:hover  { border-color:var(--hot); color:var(--hot); background:rgba(255,107,107,0.08); }
    .t-btn.save:hover { border-color:var(--done); color:var(--done); background:rgba(45,212,167,0.08); }

    .task-empty { padding:24px; color:var(--text-muted); font-size:12px; text-align:center; }

    /* ── TASK FORM INPUTS ───────────────────────── */
    .tf-input {
      width:100%; padding:5px 8px; background:rgba(255,255,255,0.04);
      border:1px solid var(--border); border-radius:5px; color:var(--text-1);
      font-family:'Outfit',sans-serif; font-size:12px; outline:none; transition:border-color 0.15s;
    }
    .tf-input:focus { border-color:var(--accent); }
    .tf-input option { background:#0d1b2a; }
    .tf-input[type="date"]::-webkit-calendar-picker-indicator { filter:invert(0.4); cursor:pointer; }

    .btn-add-task {
      display:inline-flex; align-items:center; gap:6px; margin-top:12px;
      padding:7px 13px; border-radius:7px; border:1px dashed rgba(77,163,255,0.3);
      background:transparent; color:var(--accent); font-family:'Outfit',sans-serif;
      font-size:12px; font-weight:500; cursor:pointer; transition:all 0.18s;
    }
    .btn-add-task:hover { border-color:var(--accent); background:rgba(77,163,255,0.06); }

    /* ── GANTT ──────────────────────────────────── */
    .gantt-scroll { overflow-x:auto; scrollbar-width:thin; scrollbar-color:rgba(255,255,255,0.06) transparent; }
    .gantt-scroll::-webkit-scrollbar { height:3px; }
    .gantt-scroll::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.08); border-radius:3px; }
    .gantt-inner  { min-width:500px; padding-bottom:4px; }
    .gantt-legend { display:flex; gap:18px; margin-top:12px; font-size:10px; color:var(--text-muted); }
    .gantt-legend-item { display:flex; align-items:center; gap:6px; }

    /* ── SHARED BUTTONS ─────────────────────────── */
    .btn-primary {
      padding:7px 16px; border-radius:8px; border:none;
      background:var(--accent); color:#090f18; font-family:'Outfit',sans-serif;
      font-size:13px; font-weight:700; cursor:pointer; transition:opacity 0.18s;
    }
    .btn-primary:hover { opacity:0.88; }
    .btn-ghost {
      padding:7px 16px; border-radius:8px; border:1px solid var(--border);
      background:transparent; color:var(--text-2); font-family:'Outfit',sans-serif;
      font-size:13px; font-weight:500; cursor:pointer; transition:all 0.18s;
    }
    .btn-ghost:hover { border-color:var(--border-h); color:var(--text-1); }
    .btn-icon {
      width:28px; height:28px; border-radius:7px; border:1px solid var(--border);
      background:var(--surface); color:var(--text-2); cursor:pointer;
      display:flex; align-items:center; justify-content:center; font-size:13px;
      transition:all 0.15s; flex-shrink:0;
    }
    .btn-icon:hover { border-color:var(--border-h); color:var(--text-1); background:var(--surface-h); }

    /* ── NEW PROJECT MODAL ──────────────────────── */
    #project-modal {
      position:fixed; inset:0; z-index:200; background:rgba(0,0,0,0.75);
      display:flex; align-items:center; justify-content:center;
      opacity:0; pointer-events:none; transition:opacity 0.25s;
    }
    #project-modal.open { opacity:1; pointer-events:all; }

    .modal-box {
      background:#0b1520; border:1px solid var(--border); border-radius:16px;
      width:580px; max-width:95vw; max-height:90vh; overflow-y:auto;

    function loadState() {
      try {
        const saved = localStorage.getItem(LS_KEY);
        if (saved) {
          const parsed = JSON.parse(saved);
          const savedIds = new Set(parsed.map(p => p.id));
          const seedOnly = SEED.filter(p => !savedIds.has(p.id));
          // merge: fill in missing pm/revenue from seed for existing projects
          STATE = parsed.map(p => {
            const seed = SEED.find(s => s.id === p.id);
            return { pm: seed?.pm || '—', revenue: seed?.revenue || '—', ...p };
          }).concat(seedOnly);
        } else {
          STATE = SEED.map(p => ({ ...p, tasks: p.tasks.map(t => ({ ...t })) }));
        }
      } catch(e) {
        STATE = SEED.map(p => ({ ...p, tasks: p.tasks.map(t => ({ ...t })) }));
      }
    }

    function saveState() { localStorage.setItem(LS_KEY, JSON.stringify(STATE)); }

    function daysFrom(base, d) {
      if (!d || !base) return null;
      return Math.round((new Date(d+'T00:00:00') - new Date(base+'T00:00:00')) / 86400000);
    }
    function daysSpan(s, e) {
      if (!s || !e) return null;
      return Math.round((new Date(e+'T00:00:00') - new Date(s+'T00:00:00')) / 86400000) + 1;
    }
    function fmtShort(s) {
      if (!s) return '—';
      return new Date(s+'T00:00:00').toLocaleDateString('en-GB', { day:'numeric', month:'short' });
    }
    function fmtFull(s) {
      if (!s) return '—';
      return new Date(s+'T00:00:00').toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' });
    }
    function todayISO() { return new Date().toISOString().slice(0,10); }
    function esc(s)     { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

    /* ── PROGRESS ───────────────────────────────────────────── */
    function projProgress(p) {
      if (!p.tasks || !p.tasks.length) return { pct:0, done:0, total:0 };
      const pct  = Math.round(p.tasks.reduce((s,t) => s+t.progress,0) / p.tasks.length);
      const done = p.tasks.filter(t => t.status==='completed').length;
      return { pct, done, total:p.tasks.length };
    }

    /* ── STATS BAR ──────────────────────────────────────────── */
    function renderStats() {
      const bar = document.getElementById('stats-bar');
      bar.innerHTML = '';
      [
        { color:'#4da3ff', num:STATE.filter(p=>p.status!=='done').length,             lbl:'Active Projects' },
        { color:'#4da3ff', num:STATE.filter(p=>p.category==='claims').length,          lbl:'Olvo Claims' },
        { color:'#b594f8', num:STATE.filter(p=>p.category==='uw').length,              lbl:'Olvo UW' },
        { color:'#ff6b6b', num:STATE.filter(p=>p.status==='hot'||p.status==='v2').length, lbl:'Urgent' },
        { color:'#2dd4a7', num:STATE.filter(p=>p.status==='done').length,              lbl:'Completed' },
      ].forEach(s => {
        const el = document.createElement('div');
        el.className = 'stat-pill';
        el.innerHTML = `<div class="stat-dot" style="background:${s.color}"></div><span class="stat-num">${s.num}</span><span class="stat-lbl">${s.lbl}</span>`;
        bar.appendChild(el);
      });
    }

    /* ── GRID ───────────────────────────────────────────────── */
    function renderGrid() {
      const grid = document.getElementById('grid');
      const noR  = document.getElementById('no-results');
      grid.querySelectorAll('.card').forEach(c => c.remove());

      STATE.forEach((p, i) => {
        const prog   = projProgress(p);
        const color  = STATUS_COLOR[p.status];
        const tagCls = TAG_CLASS[p.product] || '';

        const card = document.createElement('div');
        card.className = 'card';
        card.dataset.status   = p.status;
        card.dataset.category = p.category;
        card.style.animationDelay = `${0.05 + i * 0.05}s`;

        card.innerHTML = `
          <div class="card-top">
            <div class="card-identity">
              <div class="monogram" style="background:${p.monoColor}">${p.mono}</div>
              <div><div class="client-name">${esc(p.client)}</div><div class="client-sub">${esc(p.sub)}</div></div>
            </div>
            <div class="status-badge badge-${p.status}">
              <div class="status-dot" style="background:${color}"></div>${p.badge}
            </div>
          </div>
          <div class="card-project">${esc(p.project)}</div>
          <div class="card-tags">
            <span class="tag ${tagCls}">${p.product}</span>
            <span class="tag">${p.phase}</span>
          </div>
          <div class="divider"></div>
          <div class="card-row"><span class="row-lbl">DL</span><span class="row-val ${p.urgent?'urgent':''}">${esc(p.deadline)}</span></div>
          <div class="card-row"><span class="row-lbl">NEXT</span><span class="row-val primary">${esc(p.next)}</span></div>
          <div class="card-row"><span class="row-lbl">PM</span><span class="row-val">${esc(p.pm||'—')}</span></div>
          <div class="card-row"><span class="row-lbl">REV</span><span class="row-val revenue">${esc(p.revenue||'—')}</span></div>
          <div class="progress-wrap">
            <div class="progress-header">
              <span class="progress-lbl">Tasks ${prog.done}/${prog.total}</span>
              <span class="progress-count">${prog.pct}%</span>
            </div>
            <div class="progress-track"><div class="progress-fill" style="width:${prog.pct}%;background:${color}"></div></div>
          </div>
          <button class="card-del" title="Delete project">🗑</button>`;

        card.addEventListener('click', () => showDetail(p.id));
        card.querySelector('.card-del').addEventListener('click', e => {
          e.stopPropagation();
          deleteProject(p.id);
        });
        grid.insertBefore(card, noR);
      });

      applyFilter(activeFilter);
    }

    function applyFilter(f) {
      activeFilter = f;
      const noR = document.getElementById('no-results');
      let vis = 0;
      document.querySelectorAll('.card').forEach(card => {
        const show = f==='all' ? true : f==='claims' ? card.dataset.category==='claims'
          : f==='uw' ? card.dataset.category==='uw' : f==='platform' ? card.dataset.category==='platform'
          : f==='done' ? card.dataset.status==='done' : false;
        card.classList.toggle('hidden', !show);
        if (show) vis++;
      });
      noR.classList.toggle('visible', vis===0);
    }

    /* ── VIEW SWITCHING ─────────────────────────────────────── */
    function showDetail(projectId) {
      activeProjectId  = projectId;
      editingTimeline  = false;
      editingInfo      = false;
      editingTaskId    = null;
      showAddForm      = false;
      currentView      = 'detail';
      document.getElementById('view-list').style.display   = 'none';
      document.getElementById('view-detail').style.display = 'block';
      renderDetail();
      window.scrollTo(0, 0);
    }

    function showList() {
      currentView = 'list';
      document.getElementById('view-list').style.display   = 'block';
      document.getElementById('view-detail').style.display = 'none';
      activeProjectId = null;
    }

    /* ── DETAIL VIEW ────────────────────────────────────────── */
    function renderDetail() {
      const p = getProj(activeProjectId);
      if (!p) return;
      document.getElementById('view-detail').innerHTML = buildDetail(p);
    }

    function buildDetail(p) {
      const color  = STATUS_COLOR[p.status];
      const tasks  = p.tasks || [];
      const today  = todayISO();
      const prog   = projProgress(p);

      /* timeline calc */
      const planD  = daysSpan(p.planStart, p.planEnd);
      const actD   = p.actualStart ? daysSpan(p.actualStart, p.actualEnd || today) : null;
      const variance = (planD && actD) ? actD - planD : null;
      const varBadge = variance===null ? ''
        : variance>0  ? `<span class="var-badge var-over">+${variance}d over</span>`
        : variance<0  ? `<span class="var-badge var-under">${Math.abs(variance)}d ahead</span>`
        :                `<span class="var-badge var-on">On track</span>`;

      /* ── detail header ── */
      let html = `
        <div class="detail-header">
          <button class="btn-back" onclick="showList()">← Back</button>
          <div class="monogram" style="background:${p.monoColor};width:44px;height:44px;border-radius:11px;font-size:12px;flex-shrink:0">${p.mono}</div>
          <div class="detail-identity">
            <div class="detail-client">${esc(p.client)} · ${esc(p.product)}</div>
            <div class="detail-title">${esc(p.project)}</div>
            <div class="detail-meta">
              <span><span class="meta-lbl">PM</span> ${esc(p.pm||'—')}</span>
              <span><span class="meta-lbl">Revenue</span> <span style="color:var(--done);font-weight:600">${esc(p.revenue||'—')}</span></span>
              <span><span class="meta-lbl">Phase</span> ${esc(p.phase)}</span>
              <span><span class="meta-lbl">Progress</span> ${prog.pct}%</span>
            </div>
          </div>
          <div style="display:flex;align-items:center;gap:8px;flex-shrink:0">
            <div class="status-badge badge-${p.status}">
              <div class="status-dot" style="background:${color}"></div>${p.badge}
            </div>
            <button class="btn-icon" onclick="toggleInfo()" title="${editingInfo?'Cancel edit':'Edit project info'}"
              style="${editingInfo?'border-color:var(--accent);color:var(--accent);background:rgba(77,163,255,0.1)':''}">
              ${editingInfo ? '×' : '✎'}
            </button>
            <button class="btn-icon" onclick="deleteProject('${p.id}')" title="Delete project"
              style="border-color:rgba(255,107,107,0.25);color:var(--hot);"
              onmouseover="this.style.background='rgba(255,107,107,0.1)'"
              onmouseout="this.style.background='var(--surface)'">🗑</button>
          </div>
        </div>
        <div class="detail-body">`;

      /* ── project info edit form ── */
      if (editingInfo) {
        const statusOpts = ['hot','active','poc','v2','done'].map(s =>
          `<option value="${s}"${p.status===s?' selected':''}>${s.charAt(0).toUpperCase()+s.slice(1)}</option>`).join('');
        const productOpts = ['Olvo Claims','Olvo UW','Platform','Analytics'].map(s =>
          `<option value="${s}"${p.product===s?' selected':''}>${s}</option>`).join('');
        html += `<div class="det-section" style="background:rgba(77,163,255,0.04);border:1px solid rgba(77,163,255,0.12);border-radius:12px;padding:20px 20px 16px;margin-bottom:24px">
          <div class="det-section-hdr" style="margin-bottom:16px">
            <div class="det-section-title">Edit Project Info</div>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
            <div class="tl-field form-full" style="grid-column:1/-1"><label>Project Title</label><input type="text" id="ei-project" class="tf-input" value="${esc(p.project)}" style="width:100%"></div>
            <div class="tl-field"><label>Client Name</label><input type="text" id="ei-client" class="tf-input" value="${esc(p.client)}" style="width:100%"></div>
            <div class="tl-field"><label>Sub / Location</label><input type="text" id="ei-sub" class="tf-input" value="${esc(p.sub)}" style="width:100%"></div>
            <div class="tl-field"><label>Product</label>
              <select id="ei-product" class="tf-input" style="width:100%">${productOpts}</select>
            </div>
            <div class="tl-field"><label>Phase</label><input type="text" id="ei-phase" class="tf-input" value="${esc(p.phase)}" style="width:100%"></div>
            <div class="tl-field"><label>Status</label>
              <select id="ei-status" class="tf-input" style="width:100%">${statusOpts}</select>
            </div>
            <div class="tl-field"><label>Badge Label</label><input type="text" id="ei-badge" class="tf-input" value="${esc(p.badge)}" style="width:100%"></div>
            <div class="tl-field"><label>Project Manager</label><input type="text" id="ei-pm" class="tf-input" value="${esc(p.pm||'')}" style="width:100%"></div>
            <div class="tl-field"><label>Potential Revenue</label><input type="text" id="ei-revenue" class="tf-input" value="${esc(p.revenue||'')}" style="width:100%"></div>
            <div class="tl-field" style="grid-column:1/-1"><label>Deadline / Date Label</label><input type="text" id="ei-deadline" class="tf-input" value="${esc(p.deadline||'')}" style="width:100%"></div>
            <div class="tl-field" style="grid-column:1/-1"><label>Next Action</label><input type="text" id="ei-next" class="tf-input" value="${esc(p.next||'')}" style="width:100%"></div>
          </div>
          <div style="display:flex;gap:8px;margin-top:14px">
            <button class="btn-ghost" style="padding:6px 14px;font-size:12px" onclick="toggleInfo()">Cancel</button>
            <button class="btn-primary" style="padding:6px 14px;font-size:12px" onclick="saveInfo()">Save Changes</button>
          </div>
        </div>`;
      }

      /* ── timeline section ── */
      html += `<div class="det-section">
        <div class="det-section-hdr">
          <div class="det-section-title">Project Timeline</div>
          <button class="btn-icon" onclick="toggleTimeline()" title="${editingTimeline?'Cancel':'Edit dates'}">
            ${editingTimeline ? '×' : '✎'}
          </button>
        </div>`;

      if (editingTimeline) {
        html += `<div class="tl-edit-grid">
          <div class="tl-field"><label>Plan Start</label><input type="date" id="tl-ps" class="tf-input" value="${p.planStart||''}"></div>
          <div class="tl-field"><label>Plan End</label><input type="date" id="tl-pe" class="tf-input" value="${p.planEnd||''}"></div>
          <div class="tl-field"><label>Actual Start</label><input type="date" id="tl-as" class="tf-input" value="${p.actualStart||''}"></div>
          <div class="tl-field"><label>Actual End</label><input type="date" id="tl-ae" class="tf-input" value="${p.actualEnd||''}"></div>
        </div>
        <div style="display:flex;gap:8px;margin-top:4px">
          <button class="btn-ghost" style="padding:6px 14px;font-size:12px" onclick="toggleTimeline()">Cancel</button>
          <button class="btn-primary" style="padding:6px 14px;font-size:12px" onclick="saveTimeline()">Save</button>
        </div>`;
      } else {
        html += `<div class="timeline-grid">
          <div class="timeline-chip">
            <div class="tc-lbl">Plan</div>
            <div class="tc-dates">${fmtFull(p.planStart)} → ${fmtFull(p.planEnd)}</div>
            <div class="tc-days">${planD ? planD+' days' : '—'}</div>
          </div>
          <div class="timeline-chip">
            <div class="tc-lbl">Actual ${varBadge}</div>
            <div class="tc-dates">${fmtFull(p.actualStart)} → ${p.actualEnd ? fmtFull(p.actualEnd) : 'Ongoing'}</div>
            <div class="tc-days">${actD ? actD+' days' : '—'}</div>
          </div>
        </div>`;
      }
      html += `</div>`;

      /* ── tasks section ── */
      html += `<div class="det-section">
        <div class="det-section-hdr">
          <div class="det-section-title">Tasks (${tasks.length})</div>
        </div>`;

      if (tasks.length > 0 || (showAddForm && editingTaskId===null)) {
        html += `<div class="task-table-scroll"><table class="task-table">
          <thead><tr>
            <th>Task</th>
            <th>Plan Start</th><th>Plan End</th><th>Plan Days</th>
            <th>Actual Start</th><th>Actual End</th><th>Actual Days</th>
            <th>Progress</th><th>Status</th><th>Remarks</th>
            <th></th>
          </tr></thead><tbody>`;

        tasks.forEach(t => {
          if (editingTaskId===t.id) {
            html += taskFormRow(t, false);
          } else {
            const pd = daysSpan(t.planStart, t.planEnd);
            const ad = t.actualStart ? daysSpan(t.actualStart, t.actualEnd||today) : null;
            const ts = TASK_STATUS[t.status] || TASK_STATUS['not-started'];
            html += `<tr>
              <td><span class="task-name-cell" title="${esc(t.name)}">${esc(t.name)}</span></td>
              <td>${fmtShort(t.planStart)}</td><td>${fmtShort(t.planEnd)}</td><td>${pd||'—'}</td>
              <td>${fmtShort(t.actualStart)}</td><td>${fmtShort(t.actualEnd)}</td><td>${ad||'—'}</td>
              <td>
                <div class="t-prog-wrap">
                  <div class="t-prog-track"><div class="t-prog-fill" style="width:${t.progress}%;background:${color}"></div></div>
                  <span class="t-prog-pct">${t.progress}%</span>
                </div>
              </td>
              <td><span class="ts-badge" style="background:${ts.bg};color:${ts.color}">${ts.label}</span></td>
              <td><span class="t-remarks" title="${esc(t.remarks||'')}">${esc(t.remarks||'—')}</span></td>
              <td>
                <div class="t-actions">
                  <button class="t-btn" onclick="startEdit('${t.id}')" title="Edit">✎</button>
                  <button class="t-btn del" onclick="deleteTask('${t.id}')" title="Delete">×</button>
                </div>
              </td>
            </tr>`;
          }
        });

        if (showAddForm && editingTaskId===null) html += taskFormRow(null, true);
        html += `</tbody></table></div>`;
      } else {
        html += `<div class="task-empty">No tasks yet. Add your first task below.</div>`;
      }

      if (!showAddForm && editingTaskId===null) {
        html += `<button class="btn-add-task" onclick="openAddForm()">+ Add Task</button>`;
      }
      html += `</div>`;

      /* ── gantt section ── */
      if (tasks.length > 0) {
        html += `<div class="det-section">
          <div class="det-section-hdr"><div class="det-section-title">Gantt Chart</div></div>
          ${buildGantt(tasks, color)}
        </div>`;
      }

      html += `</div>`; // detail-body
      return html;
    }

    /* ── TIMELINE EDIT ──────────────────────────────────────── */
    function toggleTimeline() { editingTimeline = !editingTimeline; renderDetail(); }

    function saveTimeline() {
      const p = getProj(activeProjectId);
      if (!p) return;
      const ps = document.getElementById('tl-ps')?.value;
      const pe = document.getElementById('tl-pe')?.value;
      if (!ps || !pe) { alert('Plan start and plan end are required.'); return; }
      p.planStart   = ps;
      p.planEnd     = pe;
      p.actualStart = document.getElementById('tl-as')?.value || null;
      p.actualEnd   = document.getElementById('tl-ae')?.value || null;
      editingTimeline = false;
      saveState(); renderGrid(); renderDetail();
    }

    /* ── PROJECT INFO EDIT ─────────────────────────────────── */
    function toggleInfo() { editingInfo = !editingInfo; renderDetail(); }

    function saveInfo() {
      const p = getProj(activeProjectId);
      if (!p) return;
      const project = document.getElementById('ei-project')?.value.trim();
      const client  = document.getElementById('ei-client')?.value.trim();
      if (!project || !client) { alert('Project title and client name are required.'); return; }
      p.project  = project;
      p.client   = client;
      p.sub      = document.getElementById('ei-sub')?.value.trim()      || p.sub;
      p.product  = document.getElementById('ei-product')?.value         || p.product;
      p.phase    = document.getElementById('ei-phase')?.value.trim()    || p.phase;
      p.status   = document.getElementById('ei-status')?.value          || p.status;
      p.badge    = document.getElementById('ei-badge')?.value.trim()    || p.badge;
      p.pm       = document.getElementById('ei-pm')?.value.trim()       || p.pm;
      p.revenue  = document.getElementById('ei-revenue')?.value.trim()  || p.revenue;
      p.deadline = document.getElementById('ei-deadline')?.value.trim() || p.deadline;
      p.next     = document.getElementById('ei-next')?.value.trim()     || p.next;
      p.urgent   = p.status === 'hot' || p.status === 'v2';
      const catMap = { 'Olvo Claims':'claims','Olvo UW':'uw','Platform':'platform','Analytics':'other' };
      p.category = catMap[p.product] || p.category;
      editingInfo = false;
      saveState(); renderGrid(); renderDetail();
    }

    /* ── TASK FORM ROW ──────────────────────────────────────── */
    function taskFormRow(task, isNew) {
      const t = task || { id:'',name:'',planStart:'',planEnd:'',actualStart:'',actualEnd:'',progress:0,status:'not-started',remarks:'' };
      const statusOpts = Object.entries(TASK_STATUS).map(([k,v]) =>
        `<option value="${k}"${k===t.status?' selected':''}>${v.label}</option>`).join('');
      const onSave   = isNew ? `saveNewTask()`   : `saveEdit('${t.id}')`;
      const onCancel = isNew ? `cancelAdd()`     : `cancelEdit()`;
      const inp = (id,type,val,w,extra='') =>
        `<input type="${type}" id="${id}" class="tf-input" value="${esc(val)}" style="width:${w}" ${extra}>`;
      return `<tr style="background:rgba(77,163,255,0.04)">
        <td>${inp('tf-name','text',t.name,'150px','placeholder="Task name"')}</td>
        <td>${inp('tf-ps','date',t.planStart,'115px')}</td>
        <td>${inp('tf-pe','date',t.planEnd,'115px')}</td>
        <td style="color:var(--text-muted);font-size:10px">—</td>
        <td>${inp('tf-as','date',t.actualStart||'','115px')}</td>
        <td>${inp('tf-ae','date',t.actualEnd||'','115px')}</td>
        <td style="color:var(--text-muted);font-size:10px">—</td>
        <td>${inp('tf-prog','number',t.progress,'55px','min="0" max="100"')}</td>
        <td><select id="tf-status" class="tf-input" style="width:110px">${statusOpts}</select></td>
        <td>${inp('tf-remarks','text',t.remarks||'','100px','placeholder="Remarks..."')}</td>
        <td>
          <div class="t-actions">
            <button class="t-btn save" onclick="${onSave}" title="Save">✓</button>
            <button class="t-btn del"  onclick="${onCancel}" title="Cancel">×</button>
          </div>
        </td>
      </tr>`;
    }

    /* ── TASK CRUD ──────────────────────────────────────────── */
    function openAddForm()  { showAddForm = true;  editingTaskId = null; renderDetail(); }
    function cancelAdd()    { showAddForm = false; renderDetail(); }
    function cancelEdit()   { editingTaskId = null; renderDetail(); }
    function startEdit(id)  { editingTaskId = id; showAddForm = false; renderDetail(); }

    function readForm() {
      return {
        name:        document.getElementById('tf-name')?.value.trim()    || '',
        planStart:   document.getElementById('tf-ps')?.value              || '',
        planEnd:     document.getElementById('tf-pe')?.value              || '',
        actualStart: document.getElementById('tf-as')?.value              || null,
        actualEnd:   document.getElementById('tf-ae')?.value              || null,
        progress:    parseInt(document.getElementById('tf-prog')?.value   || '0', 10),
        status:      document.getElementById('tf-status')?.value          || 'not-started',
        remarks:     document.getElementById('tf-remarks')?.value         || '',
      };
    }

    function saveNewTask() {
      const f = readForm();
      if (!f.name || !f.planStart || !f.planEnd) { alert('Task name, plan start and plan end are required.'); return; }
      const p = getProj(activeProjectId);
      if (!p) return;
      if (!p.tasks) p.tasks = [];
      p.tasks.push({ id:genId(), ...f });
      showAddForm = false;
      saveState(); renderGrid(); renderDetail();
    }

    function saveEdit(taskId) {
      const f = readForm();
      if (!f.name || !f.planStart || !f.planEnd) { alert('Task name, plan start and plan end are required.'); return; }
      const p   = getProj(activeProjectId);
      const idx = p?.tasks.findIndex(t => t.id===taskId);
      if (!p || idx===-1) return;
      p.tasks[idx] = { ...p.tasks[idx], ...f };
      editingTaskId = null;
      saveState(); renderGrid(); renderDetail();
    }

    function deleteTask(taskId) {
      const p = getProj(activeProjectId);
      if (!p) return;
      p.tasks = p.tasks.filter(t => t.id!==taskId);
      saveState(); renderGrid(); renderDetail();
    }

    function deleteProject(projectId) {
      const p = getProj(projectId);
      if (!p) return;
      const confirmed = window.confirm(
        `Delete "${p.client} — ${p.project}"?\n\nThis will permanently remove the project and all its tasks. This cannot be undone.`
      );
      if (!confirmed) return;
      STATE = STATE.filter(pr => pr.id !== projectId);
      saveState();
      showList();
      renderStats();
      renderGrid();
    }

    /* ── GANTT ──────────────────────────────────────────────── */
    function buildGantt(tasks, projectColor) {
      const today = todayISO();
      const allS  = tasks.map(t=>t.planStart).filter(Boolean);
      const allE  = tasks.map(t=>t.planEnd).filter(Boolean);
      if (!allS.length) return '';

      const rangeStart = allS.reduce((a,b)=>a<b?a:b);
      const rangeEnd   = allE.reduce((a,b)=>a>b?a:b);
      const total      = daysSpan(rangeStart, rangeEnd);
      if (!total || total<1) return '';

      const toLeft  = d => d ? Math.max(0, daysFrom(rangeStart,d)/total*100) : null;
      const toWidth = (s,e) => { if (!s||!e) return 0; return Math.max(0.4, Math.min(100, daysSpan(s,e)/total*100)); };

      /* axis */
      let axisTicks='', axisLabels='';
      let cur = new Date(rangeStart+'T00:00:00'); cur.setDate(1);
      const endD = new Date(rangeEnd+'T00:00:00');
      while (cur<=endD) {
        const iso = cur.toISOString().slice(0,10);
        const l   = toLeft(iso);
        if (l!==null) {
          const lbl = cur.toLocaleDateString('en-GB',{month:'short',year:'2-digit'});
          axisTicks  += `<div style="position:absolute;left:${l}%;top:0;bottom:0;width:1px;background:rgba(255,255,255,0.04)"></div>`;
          axisLabels += `<div style="position:absolute;left:${l}%;transform:translateX(-50%);font-size:8.5px;font-family:'Space Mono',monospace;color:var(--text-muted);top:4px;white-space:nowrap">${lbl}</div>`;
        }
        cur.setMonth(cur.getMonth()+1);
      }

      const todayLeft = toLeft(today);
      const todayLine = (todayLeft!==null && todayLeft>=0 && todayLeft<=100)
        ? `<div style="position:absolute;left:${todayLeft}%;top:0;bottom:0;width:1.5px;background:var(--hot);opacity:0.65;z-index:3;pointer-events:none"></div>` : '';

      let rows='';
      tasks.forEach(t => {
        const ts  = TASK_STATUS[t.status] || TASK_STATUS['not-started'];
        const pl  = toLeft(t.planStart);
        const pw  = toWidth(t.planStart, t.planEnd);
        const al  = t.actualStart ? toLeft(t.actualStart) : null;
        const aw  = t.actualStart ? toWidth(t.actualStart, t.actualEnd||today) : 0;

        const planBar   = pl!==null ? `<div style="position:absolute;left:${pl}%;width:${pw}%;height:8px;border-radius:3px;background:rgba(255,255,255,0.08);top:50%;transform:translateY(-50%)"></div>` : '';
        const actualBar = al!==null ? `<div style="position:absolute;left:${al}%;width:${aw}%;height:14px;border-radius:3px;overflow:hidden;top:50%;transform:translateY(-50%);background:${ts.bg}">
            <div style="width:${t.progress}%;height:100%;background:${ts.color};opacity:0.75;border-radius:3px"></div>
          </div>` : '';

        rows += `<div style="display:grid;grid-template-columns:130px 1fr;align-items:center;height:36px;margin-bottom:2px">
          <div style="font-size:11px;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:10px" title="${esc(t.name)}">${esc(t.name)}</div>
          <div style="position:relative;height:100%">
            ${axisTicks}${planBar}${actualBar}${todayLine}
          </div>
        </div>`;
      });

      return `<div class="gantt-scroll"><div class="gantt-inner">
        <div style="display:grid;grid-template-columns:130px 1fr;margin-bottom:4px">
          <div></div>
          <div style="position:relative;height:24px;border-bottom:1px solid var(--border)">${axisLabels}</div>
        </div>
        ${rows}
      </div></div>
      <div class="gantt-legend">
        <div class="gantt-legend-item"><span style="display:inline-block;width:16px;height:5px;border-radius:3px;background:rgba(255,255,255,0.1)"></span> Plan</div>
        <div class="gantt-legend-item"><span style="display:inline-block;width:16px;height:10px;border-radius:3px;background:${projectColor};opacity:0.6"></span> Actual</div>
        <div class="gantt-legend-item"><span style="display:inline-block;width:1.5px;height:12px;background:var(--hot);opacity:0.65"></span> Today</div>
      </div>`;
    }

    /* ── NEW PROJECT MODAL ──────────────────────────────────── */
    function openProjectModal()  { document.getElementById('project-modal').classList.add('open'); }
    function closeProjectModal() {
      document.getElementById('project-modal').classList.remove('open');
      ['pf-client','pf-sub','pf-project','pf-pm','pf-revenue','pf-next','pf-remarks',
       'pf-plan-start','pf-plan-end','pf-actual-start','pf-actual-end']
        .forEach(id => { const el=document.getElementById(id); if(el) el.value=''; });
    }

    function submitNewProject() {
      const client  = document.getElementById('pf-client')?.value.trim();
      const project = document.getElementById('pf-project')?.value.trim();
      const ps      = document.getElementById('pf-plan-start')?.value;
      const pe      = document.getElementById('pf-plan-end')?.value;
      if (!client || !project || !ps || !pe) { alert('Client name, project title, plan start and plan end are required.'); return; }

      const product  = document.getElementById('pf-product')?.value  || 'Olvo Claims';
      const status   = document.getElementById('pf-status')?.value   || 'active';
      const catMap   = { 'Olvo Claims':'claims','Olvo UW':'uw','Platform':'platform','Analytics':'other' };
      const badgeMap = { hot:'Urgent',active:'Active',poc:'POC',v2:'V2 Dev' };
      const mono     = (client.match(/\b[A-Z]/g)||[]).slice(0,3).join('') || client.slice(0,3).toUpperCase();
      const palette  = ['#1565c0','#2e7d32','#6a1b9a','#bf360c','#e65100','#00695c','#1a6eb5','#b71c1c'];

      STATE.unshift({
        id: 'proj-'+genId(), client, project, product,
        sub:        document.getElementById('pf-sub')?.value.trim()      || '',
        mono,
        monoColor:  palette[STATE.length % palette.length],
        category:   catMap[product] || 'other',
        status, badge: badgeMap[status]||'Active', phase:'New',
        deadline:   `${ps} → ${pe}`,
        urgent:     status==='hot'||status==='v2',
        pm:         document.getElementById('pf-pm')?.value.trim()       || '—',
        revenue:    document.getElementById('pf-revenue')?.value.trim()  || '—',
        next:       document.getElementById('pf-next')?.value.trim()     || '',
        planStart:ps, planEnd:pe,
        actualStart: document.getElementById('pf-actual-start')?.value   || null,
        actualEnd:   document.getElementById('pf-actual-end')?.value     || null,
        tasks: [], isCustom: true,
      });
      saveState(); renderStats(); renderGrid(); closeProjectModal();
    }

    /* ── FILTERS ────────────────────────────────────────────── */
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        applyFilter(btn.dataset.filter);
      });
    });

    /* ── KEYBOARD ───────────────────────────────────────────── */
    document.addEventListener('keydown', e => {
      if (e.key==='Escape') {
        if (document.getElementById('project-modal').classList.contains('open')) closeProjectModal();
        else if (currentView==='detail') showList();
      }
    });

    /* ── LIVE DATE ──────────────────────────────────────────── */
    document.getElementById('live-date').textContent = new Date().toLocaleDateString('en-GB',{
      weekday:'long', day:'numeric', month:'long', year:'numeric',
    });

    /* ── INIT ───────────────────────────────────────────────── */
    loadState();
    renderStats();
    renderGrid();
  </script>
</body>
</html>
