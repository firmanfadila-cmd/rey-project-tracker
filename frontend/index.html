<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>REY — Sign In</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231a6eb5'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='monospace' font-weight='700' font-size='12' fill='white'%3EREY%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy:         #090f18;
      --navy-surface: #0d1b2a;
      --surface:      rgba(255,255,255,0.038);
      --border:       rgba(255,255,255,0.07);
      --border-h:     rgba(77,163,255,0.3);
      --text-1:       #dde8f5;
      --text-2:       #8fafc9;
      --text-muted:   #3f607e;
      --accent:       #4da3ff;
      --accent-mid:   #1a6eb5;
      --orange:       #f5730c;
      --error:        #ff6b6b;
    }

    html, body {
      min-height: 100vh;
      font-family: 'Poppins', sans-serif;
      color: var(--text-1);
      background:
        radial-gradient(ellipse 70% 60% at 15% 0%, rgba(245,115,12,0.10) 0%, transparent 55%),
        url("data:image/svg+xml,%3Csvg width='40' height='40' viewBox='0 0 40 40' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='20' cy='20' r='0.8' fill='%234da3ff' fill-opacity='0.03'/%3E%3C/svg%3E"),
        linear-gradient(135deg, #0a1628 0%, #123a5c 55%, #1a6ea3 100%);
      background-attachment: fixed;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-wrap {
      width: 100%;
      max-width: 400px;
      padding: 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 40px;
      justify-content: center;
    }
    .logo {
      width: 44px; height: 44px; border-radius: 14px;
      background: linear-gradient(145deg, var(--accent-mid) 0%, var(--accent) 100%);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Poppins', sans-serif; font-weight: 800; font-size: 16px;
      color: #fff; letter-spacing: -0.5px;
      box-shadow: 0 4px 24px rgba(77,163,255,0.3);
      position: relative;
    }
    .logo::after {
      content: ''; position: absolute; top: -3px; right: -3px;
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--orange); border: 2px solid #0a1628;
    }
    .brand-text { text-align: left; }
    .brand-title { font-size: 20px; font-weight: 700; letter-spacing: -0.4px; }
    .brand-sub   { font-size: 11px; color: var(--text-2); margin-top: 2px; }

    .card {
      background: rgba(13,27,42,0.72);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 20px;
      padding: 32px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    }

    .card-title {
      font-size: 18px; font-weight: 700; margin-bottom: 6px;
    }
    .card-sub {
      font-size: 13px; color: var(--text-2); margin-bottom: 28px;
    }

    .field { margin-bottom: 18px; }
    .field label {
      display: block;
      font-size: 12px; font-weight: 600; color: var(--text-2);
      margin-bottom: 7px; letter-spacing: 0.3px;
    }
    .field input {
      width: 100%;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      font-family: 'Poppins', sans-serif; font-size: 14px; color: var(--text-1);
      outline: none;
      transition: border-color 0.18s, background 0.18s;
    }
    .field input::placeholder { color: var(--text-muted); }
    .field input:focus {
      border-color: var(--border-h);
      background: rgba(77,163,255,0.04);
    }

    .error-msg {
      font-size: 12px; color: var(--error);
      margin-bottom: 16px; display: none;
      background: rgba(255,107,107,0.08);
      border: 1px solid rgba(255,107,107,0.2);
      border-radius: 8px; padding: 9px 12px;
    }
    .error-msg.visible { display: block; }

    .btn-login {
      width: 100%;
      background: linear-gradient(135deg, var(--accent-mid) 0%, var(--accent) 100%);
      border: none; border-radius: 100px;
      padding: 13px;
      font-family: 'Poppins', sans-serif; font-size: 14px; font-weight: 700;
      color: #fff; cursor: pointer; letter-spacing: 0.2px;
      transition: opacity 0.18s, transform 0.12s;
      box-shadow: 0 4px 16px rgba(77,163,255,0.25);
    }
    .btn-login:hover   { opacity: 0.9; }
    .btn-login:active  { transform: scale(0.98); }
    .btn-login:disabled { opacity: 0.5; cursor: not-allowed; }

    .footer-note {
      text-align: center; margin-top: 20px;
      font-size: 11px; color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="brand">
      <div class="logo">rey</div>
      <div class="brand-text">
        <div class="brand-title">Project Tracker</div>
        <div class="brand-sub">PT Vertika Technologies Nusantara</div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Sign in</div>
      <div class="card-sub">Use your REY account credentials</div>

      <form id="login-form" autocomplete="on">
        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" placeholder="you@rey.id" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" type="password" placeholder="••••••••" autocomplete="current-password" required>
        </div>
        <div id="error-msg" class="error-msg"></div>
        <button type="submit" class="btn-login" id="btn-login">Sign in</button>
      </form>
    </div>

    <div class="footer-note">Internal access only — REY team</div>
  </div>

  <script>
    // Redirect if already logged in
    if (localStorage.getItem('rey_token')) {
      location.href = '/dashboard.html';
    }

    const form    = document.getElementById('login-form');
    const errMsg  = document.getElementById('error-msg');
    const btnLogin = document.getElementById('btn-login');

    form.addEventListener('submit', async e => {
      e.preventDefault();
      errMsg.classList.remove('visible');
      btnLogin.disabled = true;
      btnLogin.textContent = 'Signing in…';

      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        const res  = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });
        const json = await res.json();
        if (!res.ok || json.error) {
          errMsg.textContent = json.error || 'Login failed';
          errMsg.classList.add('visible');
          btnLogin.disabled = false;
          btnLogin.textContent = 'Sign in';
          return;
        }
        localStorage.setItem('rey_token', json.data.token);
        localStorage.setItem('rey_user',  JSON.stringify(json.data.user));
        location.href = '/dashboard.html';
      } catch {
        errMsg.textContent = 'Network error — please try again';
        errMsg.classList.add('visible');
        btnLogin.disabled = false;
        btnLogin.textContent = 'Sign in';
      }
    });
  </script>
</body>
</html>
